{{- if and .Values.sandbox.enabled}}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
{{- include "dify.labels" . | nindent 4 }}
    app: {{ template "dify.fullname" . }}-sandbox
  name: {{ template "dify.fullname" . }}-sandbox
spec:
  replicas: {{ .Values.sandbox.replicas }}
  selector:
    matchLabels:
{{- include "dify.selectorLabels" . | nindent 6 }}
      app: {{ template "dify.fullname" . }}-sandbox
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/sandbox/sandbox-config.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/sandbox/sandbox-secret.yaml") . | sha256sum }}
      labels:
{{- include "dify.selectorLabels" . | nindent 8 }}
        app: {{ template "dify.fullname" . }}-sandbox
{{- include "dify.podExtraLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- if include "dify.hasImagePullSecrets" . }}
      imagePullSecrets:
{{ include "dify.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- if include "dify.customCA.enabled" . }}
      initContainers:
      {{ include "dify.customCA.initContainer" . | nindent 6 }}
      {{- end }}
      containers:
      - image: "{{ .Values.sandbox.image.repository }}:{{ .Values.sandbox.image.tag }}"
        imagePullPolicy: "IfNotPresent"
        name: {{ template "dify.fullname" . }}-sandbox
        {{- if .Values.sandbox.extraEnv }}
        env:
          {{- toYaml .Values.sandbox.extraEnv | nindent 8 }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: {{ template "dify.fullname" . }}-sandbox-config
          - secretRef:
              name: {{ template "dify.fullname" . }}-sandbox-secret
          {{- if include "dify.customCA.enabled" . }}
          - configMapRef:
              name: {{ include "dify.customCA.configName" . }}
          {{- end }}
          {{- if .Values.global.autoGenerateSecrets }}
          - secretRef:
              name: {{ include "dify.runtimeCredentialsSecretName" . }}
          {{- end }}
        ports:
          - name: sandbox
            containerPort: 8194
            protocol: TCP
        volumeMounts:
          - mountPath: /dependencies/python-requirements.txt
            name: sandbox-config
            subPath: python-requirements.txt
          {{- if include "dify.customCA.enabled" . }}
          {{ include "dify.customCA.volumeMount" . | nindent 10 }}
          {{- end }}
        {{- if .Values.sandbox.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.sandbox.readinessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.sandbox.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.sandbox.livenessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.sandbox.resources | nindent 12 }}
    {{- if .Values.sandbox.serviceAccountName }}
      serviceAccountName: {{ .Values.sandbox.serviceAccountName | quote }}
    {{- end }}
    {{- if .Values.sandbox.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.sandbox.nodeSelector | indent 8 }}
    {{- end }}
    {{- if .Values.sandbox.affinity }}
      affinity:
{{ toYaml .Values.sandbox.affinity | indent 8 }}
    {{- end }}
    {{- if .Values.sandbox.tolerations }}
      tolerations:
{{ toYaml .Values.sandbox.tolerations | indent 8 }}
    {{- end }}
      volumes:
      - configMap:
          defaultMode: 420
          name: {{ template "dify.fullname" . }}-sandbox-config
        name: sandbox-config
      {{- if include "dify.customCA.enabled" . }}
      {{ include "dify.customCA.volume" . | nindent 6 }}
      {{- end }}
{{- end }}
