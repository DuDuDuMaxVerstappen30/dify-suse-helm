{{- if .Values.global.autoGenerateSecrets }}
{{- $runtimeName := include "dify.runtimeCredentialsSecretName" . }}
{{- $postgresqlName := include "dify.postgresqlCredentialsSecretName" . }}
{{- $redisName := include "dify.redisCredentialsSecretName" . }}
{{- $qdrantName := include "dify.qdrantCredentialsSecretName" . }}
{{- $runtimeSecret := (lookup "v1" "Secret" .Release.Namespace $runtimeName) | default dict }}
{{- $runtimeData := (get $runtimeSecret "data") | default dict }}
{{- $postgresqlSecret := (lookup "v1" "Secret" .Release.Namespace $postgresqlName) | default dict }}
{{- $postgresqlData := (get $postgresqlSecret "data") | default dict }}
{{- $redisSecret := (lookup "v1" "Secret" .Release.Namespace $redisName) | default dict }}
{{- $redisData := (get $redisSecret "data") | default dict }}
{{- $qdrantSecret := (lookup "v1" "Secret" .Release.Namespace $qdrantName) | default dict }}
{{- $qdrantData := (get $qdrantSecret "data") | default dict }}

{{- $appSecret := .Values.global.appSecretKey | default (get $runtimeData "SECRET_KEY" | default "" | b64dec) | default (randAlphaNum 56) }}
{{- $innerApiKey := .Values.global.innerApiKey | default (get $runtimeData "INNER_API_KEY" | default "" | b64dec) | default (randAlphaNum 56) }}
{{- $enterpriseAppSecret := .Values.enterprise.appSecretKey | default (get $runtimeData "DASHBOARD_JWT_SECRET_KEY" | default "" | b64dec) | default (randAlphaNum 56) }}
{{- $enterpriseSalt := .Values.enterprise.adminAPIsSecretKeySalt | default (get $runtimeData "ENTERPRISE_SECRET_KEY_SALT" | default "" | b64dec) | default (randAlphaNum 48) }}
{{- $encryptionKey := .Values.enterprise.passwordEncryptionKey | default (get $runtimeData "PASSWORD_ENCRYPTION_KEY" | default "" | b64dec) | default (randBytes 32) }}
{{- $postgresPassword := .Values.postgresql.global.postgresql.auth.postgresPassword | default (get $runtimeData "DB_PASSWORD" | default "" | b64dec) | default (get $postgresqlData "postgres-password" | default "" | b64dec) | default (randAlphaNum 48) }}
{{- $redisPassword := .Values.redis.global.redis.password | default (get $runtimeData "REDIS_PASSWORD" | default "" | b64dec) | default (get $redisData "redis-password" | default "" | b64dec) | default (randAlphaNum 48) }}
{{- $qdrantApiKey := .Values.qdrant.apiKey | default (get $runtimeData "QDRANT_API_KEY" | default "" | b64dec) | default (get $qdrantData "api-key" | default "" | b64dec) | default (randAlphaNum 48) }}
{{- if .Values.externalRedis.enabled }}
  {{- $redisPassword = .Values.externalRedis.password }}
{{- end }}
{{- $redisPasswordEncoded := $redisPassword | urlquery | replace "+" "%20" }}
{{- $redisDsn := include "dify.redis.dsn" . | trim }}
{{- if .Values.redis.enabled }}
  {{- $redisDsn = printf "redis://:%s@%s-redis-master:%v/0" $redisPasswordEncoded .Release.Name .Values.redis.master.service.ports.redis }}
{{- end }}
{{- $celeryBrokerUrl := printf "redis://:%s@%s-redis-master:%v/1" $redisPasswordEncoded .Release.Name .Values.redis.master.service.ports.redis }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtimeName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "dify.labels" . | indent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $appSecret | quote }}
  DIFY_SECRET_KEY: {{ $appSecret | quote }}
  CODE_EXECUTION_API_KEY: {{ $innerApiKey | quote }}
  INNER_API_KEY: {{ $innerApiKey | quote }}
  INNER_API_KEY_FOR_PLUGIN: {{ $innerApiKey | quote }}
  PLUGIN_DAEMON_KEY: {{ $innerApiKey | quote }}
  ENTERPRISE_API_SECRET_KEY: {{ $innerApiKey | quote }}
  ENTERPRISE_PLUGIN_MANAGER_API_SECRET_KEY: {{ $innerApiKey | quote }}
  ENTERPRISE_OTLP_API_KEY: {{ $innerApiKey | quote }}
  API_KEY: {{ $innerApiKey | quote }}
  DIFY_INNER_API_KEY: {{ $innerApiKey | quote }}
  DIFY_PLUGIN_SERVERLESS_CONNECTOR_API_KEY: {{ $innerApiKey | quote }}
  PLUGIN_MANAGER_INNER_API_SECRET_KEY: {{ $innerApiKey | quote }}
  ENTERPRISE_API_KEY: {{ $innerApiKey | quote }}
  DAEMON_CLIENT_SERVER_KEY: {{ $innerApiKey | quote }}
  DAEMON_CLIENT_ADMIN_API_KEY: {{ $innerApiKey | quote }}
  SERVER_KEY: {{ $innerApiKey | quote }}
  ADMIN_API_KEY: {{ $innerApiKey | quote }}
  OTEL_API_KEY: {{ $innerApiKey | quote }}
  OTLP_API_KEY: {{ $innerApiKey | quote }}
  PLUGIN_CONNECTOR_API_KEY: {{ $innerApiKey | quote }}
  DASHBOARD_JWT_SECRET_KEY: {{ $enterpriseAppSecret | quote }}
  ENTERPRISE_SECRET_KEY_SALT: {{ $enterpriseSalt | quote }}
  PASSWORD_ENCRYPTION_KEY: {{ $encryptionKey | quote }}
{{- if .Values.postgresql.enabled }}
  DB_PASSWORD: {{ $postgresPassword | quote }}
  DIFY_DB_PASS: {{ $postgresPassword | quote }}
  ENTERPRISE_DB_PASS: {{ $postgresPassword | quote }}
  PLUGIN_DB_PASS: {{ $postgresPassword | quote }}
  AUDIT_DB_PASS: {{ $postgresPassword | quote }}
{{- end }}
{{- if or .Values.redis.enabled .Values.externalRedis.enabled }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  REDIS_DSN: {{ $redisDsn | quote }}
  DIFY_REDIS_DSN: {{ $redisDsn | quote }}
{{- end }}
{{- if .Values.redis.enabled }}
  CELERY_BROKER_URL: {{ $celeryBrokerUrl | quote }}
{{- end }}
{{- if .Values.qdrant.enabled }}
  QDRANT_API_KEY: {{ $qdrantApiKey | quote }}
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresqlName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "dify.labels" . | indent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $postgresPassword | quote }}
  password: {{ $postgresPassword | quote }}
  replication-password: {{ $postgresPassword | quote }}
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $redisName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "dify.labels" . | indent 4 }}
type: Opaque
stringData:
  redis-password: {{ $redisPassword | quote }}
{{- end }}
{{- if .Values.qdrant.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $qdrantName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "dify.labels" . | indent 4 }}
type: Opaque
stringData:
  api-key: {{ $qdrantApiKey | quote }}
  local.yaml: |
    service:
      api_key: {{ $qdrantApiKey }}
{{- end }}
{{- end }}
