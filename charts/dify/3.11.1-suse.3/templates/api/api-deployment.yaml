{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
{{- include "dify.labels" . | nindent 4 }}
    app: {{ template "dify.fullname" . }}-api
  name: {{ template "dify.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
{{- include "dify.selectorLabels" . | nindent 6 }}
      app: {{ template "dify.fullname" . }}-api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api/api-config.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/api/api-secret.yaml") . | sha256sum }}
        checksum/shared-celery-secret: {{ include (print $.Template.BasePath "/shared/celery/celery-secret.yaml") . | sha256sum }}
        checksum/shared-db-config: {{ include (print $.Template.BasePath "/shared/db/db-config.yaml") . | sha256sum }}
        checksum/shared-db-secret: {{ include (print $.Template.BasePath "/shared/db/db-secret.yaml") . | sha256sum }}
        checksum/shared-redis-config: {{ include (print $.Template.BasePath "/shared/redis/redis-config.yaml") . | sha256sum }}
        checksum/shared-redis-secret: {{ include (print $.Template.BasePath "/shared/redis/redis-secret.yaml") . | sha256sum }}
        checksum/shared-vectordb-config: {{ include (print $.Template.BasePath "/shared/vectordb/vectordb-config.yaml") . | sha256sum }}
        checksum/shared-vectordb-secret: {{ include (print $.Template.BasePath "/shared/vectordb/vectordb-secret.yaml") . | sha256sum }}
        checksum/shared-storage-config: {{ include (print $.Template.BasePath "/shared/storage/storage-config.yaml") . | sha256sum }}
        checksum/shared-storage-secret: {{ include (print $.Template.BasePath "/shared/storage/storage-secret.yaml") . | sha256sum }}
        checksum/shared-mail-config: {{ include (print $.Template.BasePath "/shared/mail/mail-config.yaml") . | sha256sum }}
        checksum/shared-mail-secret: {{ include (print $.Template.BasePath "/shared/mail/mail-secret.yaml") . | sha256sum }}
      labels:
{{- include "dify.selectorLabels" . | nindent 8 }}
        app: {{ template "dify.fullname" . }}-api
{{- include "dify.podExtraLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- if include "dify.hasImagePullSecrets" . }}
      imagePullSecrets:
{{ include "dify.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- if include "dify.customCA.enabled" . }}
      initContainers:
      {{ include "dify.customCA.initContainer" . | nindent 6 }}
      {{- end }}
      containers:
      - image: "{{ .Values.api.image.repository }}:{{ default .Chart.AppVersion .Values.api.image.tag }}"
        imagePullPolicy: "IfNotPresent"
        name: {{ template "dify.fullname" . }}-api
        {{- if .Values.api.extraEnv }}
        env:
          {{- toYaml .Values.api.extraEnv | nindent 8 }}
        {{- end }}
        envFrom:
          - configMapRef:
              name: {{ template "dify.fullname" . }}-api-config
          - secretRef:
              name: {{ template "dify.fullname" . }}-api-secret
          - secretRef:
              name: {{ template "dify.fullname" . }}-shared-celery-secret
          - configMapRef:
              name: {{ template "dify.fullname" . }}-shared-db-config
          - secretRef:
              name: {{ template "dify.fullname" . }}-shared-db-secret
          - configMapRef:
              name: {{ template "dify.fullname" . }}-shared-redis-config
          - secretRef:
              name: {{ template "dify.fullname" . }}-shared-redis-secret
          - configMapRef:
              name: {{ template "dify.fullname" . }}-shared-vectordb-config
          - secretRef:
              name: {{ template "dify.fullname" . }}-shared-vectordb-secret
          - configMapRef:
              name: {{ template "dify.fullname" . }}-shared-storage-config
          - secretRef:
              name: {{ template "dify.fullname" . }}-shared-storage-secret
          - configMapRef:
              name: {{ template "dify.fullname" . }}-shared-mail-config
          - secretRef:
              name: {{ template "dify.fullname" . }}-shared-mail-secret
          {{- if include "dify.customCA.enabled" . }}
          - configMapRef:
              name: {{ include "dify.customCA.configName" . }}
          {{- end }}
          {{- if .Values.global.autoGenerateSecrets }}
          - secretRef:
              name: {{ include "dify.runtimeCredentialsSecretName" . }}
          {{- end }}
        ports:
          - name: {{ template "dify.fullname" . }}-api
            containerPort: 5001
            protocol: TCP
        {{- if .Values.api.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.api.readinessProbe | nindent 12 }}
        {{- end }}
        {{- if .Values.api.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.api.livenessProbe | nindent 12 }}
        {{- end }}
        resources:
          {{- toYaml .Values.api.resources | nindent 12 }}
        {{- if or (eq .Values.persistence.type "local") (include "dify.customCA.enabled" .) }}
        volumeMounts:
        {{- if eq .Values.persistence.type "local" }}
        - name: app-data
          mountPath: {{ .Values.persistence.local.mountPath | quote }}
          subPath: ""
        {{- end }}
        {{- if include "dify.customCA.enabled" . }}
{{ include "dify.customCA.volumeMount" . | nindent 8 }}
        {{- end }}
        {{- end }}
    {{- if .Values.api.serviceAccountName }}
      serviceAccountName: {{ .Values.api.serviceAccountName | quote }}
    {{- end }}
    {{- if .Values.api.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.api.nodeSelector | indent 8 }}
    {{- end }}
    {{- if .Values.api.affinity }}
      affinity:
{{ toYaml .Values.api.affinity | indent 8 }}
    {{- end }}
    {{- if .Values.api.tolerations }}
      tolerations:
{{ toYaml .Values.api.tolerations | indent 8 }}
    {{- end }}
      {{- if or (eq .Values.persistence.type "local") (include "dify.customCA.enabled" .) }}
      volumes:
      {{- if eq .Values.persistence.type "local" }}
      - name: app-data
        persistentVolumeClaim:
        {{- if not .Values.persistence.local.persistentVolumeClaim.existingClaim }}
          claimName: {{ template "dify.fullname" . }}-backend-pvc
        {{- else }}
          claimName: {{ .Values.persistence.local.persistentVolumeClaim.existingClaim }}
        {{- end }}
      {{- end }}
      {{- if include "dify.customCA.enabled" . }}
{{ include "dify.customCA.volume" . | nindent 6 }}
      {{- end }}
      {{- end }}
{{- end }}
