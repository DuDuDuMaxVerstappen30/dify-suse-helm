{{- if .Values.enterprise.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "dify.fullname" . }}-enterprise-svc
  labels:
{{ include "dify.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: enterprise
      port: 8082
      protocol: TCP
      targetPort: 8082
    - name: enterprise-grpc
      port: 9000
      protocol: TCP
      targetPort: 9000
  selector:
{{ include "dify.selectorLabels" . | indent 4 }}
    app: {{ template "dify.fullname" . }}-enterprise
{{- end }}
