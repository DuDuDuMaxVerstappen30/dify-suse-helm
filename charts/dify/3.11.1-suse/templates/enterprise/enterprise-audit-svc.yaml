{{- if .Values.enterpriseAudit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "dify.fullname" . }}-enterprise-audit-svc
  labels:
{{ include "dify.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: audit
      port: 8083
      protocol: TCP
      targetPort: 8083
  selector:
{{ include "dify.selectorLabels" . | indent 4 }}
    app: {{ template "dify.fullname" . }}-enterprise-audit
{{- end }}