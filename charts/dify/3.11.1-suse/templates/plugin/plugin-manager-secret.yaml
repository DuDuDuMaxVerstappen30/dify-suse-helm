{{- $dbInstance := include "dify.dbInstance" . | fromJson }}

{{- if .Values.plugin_manager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "dify.fullname" . }}-plugin-manager-secret
type: Opaque
data:
  {{- if .Values.externalPrometheus.enabled }}
  PROMETHEUS_USERNAME: {{ .Values.externalPrometheus.username | b64enc | quote }}
  PROMETHEUS_PASSWORD: {{ .Values.externalPrometheus.password | b64enc | quote }}
  {{- end }}
  PLUGIN_MANAGER_INNER_API_SECRET_KEY: {{ .Values.global.innerApiKey | b64enc | quote }}
  ENTERPRISE_API_KEY: {{ .Values.global.innerApiKey | b64enc | quote }}
  DASHBOARD_JWT_SECRET_KEY: {{ .Values.enterprise.appSecretKey | b64enc | quote }}
  DAEMON_CLIENT_SERVER_KEY: {{ .Values.global.innerApiKey | b64enc | quote }}
  
  # Database Configuration - Per-DB Credentials
  DIFY_DB_PASS: {{ ((include "dify.dbCredentialPassword" (dict "Values" .Values "credentialKey" "dify")) | default $dbInstance.password) | b64enc | quote }}
  ENTERPRISE_DB_PASS: {{ ((include "dify.dbCredentialPassword" (dict "Values" .Values "credentialKey" "enterprise")) | default $dbInstance.password) | b64enc | quote }}
  PLUGIN_DB_PASS: {{ ((include "dify.dbCredentialPassword" (dict "Values" .Values "credentialKey" "plugin_daemon")) | default $dbInstance.password) | b64enc | quote }}

  DAEMON_CLIENT_ADMIN_API_KEY: {{ .Values.global.innerApiKey | b64enc | quote }}
{{- end }}

