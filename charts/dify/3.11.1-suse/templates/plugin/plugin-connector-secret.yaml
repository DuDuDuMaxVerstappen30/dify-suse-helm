{{- $dbInstance := include "dify.dbInstance" . | fromJson }}
{{- if .Values.plugin_daemon.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "dify.fullname" . }}-plugin-connector-secret
  namespace: {{ include "dify.pluginRuntimeNamespace" . }}
data:
  gconfig.yaml: {{ .Values.plugin_connector.generatorConf | b64enc | quote }}
  
  ENTERPRISE_DB_PASS: {{ ((include "dify.dbCredentialPassword" (dict "Values" .Values "credentialKey" "enterprise")) | default $dbInstance.password) | b64enc | quote }}
  PLUGIN_DB_PASS: {{ ((include "dify.dbCredentialPassword" (dict "Values" .Values "credentialKey" "plugin_daemon")) | default $dbInstance.password) | b64enc | quote }}
  {{- if eq .Values.persistence.type "s3" }}
  S3_ACCESS_KEY: {{ .Values.persistence.s3.accessKey | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.persistence.s3.secretKey | b64enc | quote }}
  {{- else }}
  # dify-enterprise
  S3_ACCESS_KEY: ZGlmeS1lbnRlcnByaXNl
  S3_SECRET_KEY: {{ .Values.global.innerApiKey | b64enc | quote }}
  {{- end }}
  IMAGE_REPO_SECRET: {{ .Values.plugin_connector.imageRepoSecret | b64enc | quote }}
  GITHUB_ACCESS_TOKEN: {{ .Values.plugin_connector.github.accessToken | b64enc | quote }}
{{- end }}
