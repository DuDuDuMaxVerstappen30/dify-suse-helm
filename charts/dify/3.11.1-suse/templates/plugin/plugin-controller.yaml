{{- if (default true .Values.plugin_controller.enabled) }}
{{- $runtimeNamespace := include "dify.pluginRuntimeNamespace" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "dify.fullname" . }}-crd-controller
  namespace: {{ $runtimeNamespace }}
  labels:
{{- include "dify.labels" . | nindent 4 }}
    app: {{ template "dify.fullname" . }}-crd
    control-plane: controller-manager

spec:
  selector:
    matchLabels:
{{- include "dify.selectorLabels" . | nindent 6 }}
      app: {{ template "dify.fullname" . }}-crd
      control-plane: controller-manager

  replicas: {{ .Values.plugin_controller.replicas }}
  template:
    metadata:
      labels:
{{- include "dify.selectorLabels" . | nindent 8 }}
        app: {{ template "dify.fullname" . }}-crd
        control-plane: controller-manager
{{- include "dify.podExtraLabels" . | nindent 8 }}

    spec:
      enableServiceLinks: false
      {{- if include "dify.hasImagePullSecrets" . }}
      imagePullSecrets:
{{ include "dify.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- if include "dify.customCA.enabled" . }}
      initContainers:
      {{ include "dify.customCA.initContainer" . | nindent 6 }}
      {{- end }}
      containers:
      - command:
        - /app/plugin-crd
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --namespaces={{ $runtimeNamespace }}
        env:
        {{- if .Values.plugin_connector.secure }}
        - name: NGINX_PORT
          value: "8081"
        {{- else }}
        - name: NGINX_PORT
          value: "80"
        {{- end }}
        - name: LOG_FORMAT
          value: {{ .Values.global.log.outputFormat | default "json" | quote }}
        {{- if include "dify.customCA.enabled" . }}
        envFrom:
        - configMapRef:
            name: {{ include "dify.customCA.configName" . }}
        {{- end }}
        image: "{{ .Values.plugin_controller.image.repository }}:{{ default .Chart.AppVersion .Values.plugin_controller.image.tag }}"
        name: manager
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.plugin_controller.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if include "dify.customCA.enabled" . }}
        {{ include "dify.customCA.volumeMount" . | nindent 8 }}
        {{- end }}
        {{- if .Values.plugin_controller.kube.config.secret.name }}
        - name: kubeconfig
          mountPath: /app/.kube
          readOnly: true
        {{- end }}
      volumes:
      # the trick: add an unconditional tmp volume here
      # so we can simplify conditional ones
      - name: tmp
        emptyDir: {}
      {{- if include "dify.customCA.enabled" . }}
      {{ include "dify.customCA.volume" . | nindent 6 }}
      {{- end }}
      {{- if .Values.plugin_controller.kube.config.secret.name }}
      - name: kubeconfig
        secret:
          secretName: {{ .Values.plugin_controller.kube.config.secret.name | quote }}
          items:
            - key: {{ .Values.plugin_controller.kube.config.secret.key | default "config" | quote }}
              path: config
      {{- end }}
      serviceAccountName: {{ include "dify.pluginControllerServiceAccountName" . }}
      terminationGracePeriodSeconds: 10
    {{- if .Values.plugin_controller.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.plugin_controller.nodeSelector | indent 8 }}
    {{- end }}
    {{- if .Values.plugin_controller.affinity }}
      affinity:
{{ toYaml .Values.plugin_controller.affinity | indent 8 }}
    {{- end }}
{{- if .Values.plugin_controller.tolerations }}
      tolerations:
{{ toYaml .Values.plugin_controller.tolerations | indent 8 }}
    {{- end }}
{{- end }}
