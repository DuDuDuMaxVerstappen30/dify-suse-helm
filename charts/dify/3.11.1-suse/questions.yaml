  # 10 - Features and observability
  - variable: global.otel.enabled
    label: 启用 Dify 企业遥测
    description: 将 Dify Trace 和 Metric 发送到内置 Enterprise Collector。
    type: boolean
    required: true
    group: "10 功能与可观测性 / Features"

  - variable: global.otel.samplingRate
    label: Trace 采样率
    description: 0.0 到 1.0，例如 0.2 表示采样 20%。
    type: string
    required: true
    group: "10 功能与可观测性 / Features"
    show_if: "global.otel.enabled=true"

  - variable: global.otel.sender.includeContent
    label: Trace 包含输入输出内容
    description: 可能包含业务敏感数据，生产环境建议保持关闭。
    type: boolean
    required: true
    group: "10 功能与可观测性 / Features"
    show_if: "global.otel.enabled=true"

  - variable: enterpriseCollector.enabled
    label: 部署 Enterprise Collector
    description: global.otel.enabled=true 时保持开启。
    type: boolean
    required: true
    group: "10 功能与可观测性 / Features"

  - variable: collaboration.enabled
    label: 启用多人协作编辑
    description: 部署专用 WebSocket 服务并启用工作流多人协作。
    type: boolean
    required: true
    group: "10 功能与可观测性 / Features"

  - variable: global.rag.etlType
    label: RAG ETL 类型
    description: dify 使用内置 ETL；Unstructured 使用随 Chart 部署的 Unstructured 服务。
    type: enum
    required: true
    group: "10 功能与可观测性 / Features"
    options:
      - dify
      - Unstructured

  - variable: unstructured.enabled
    label: 部署 Unstructured
    description: 仅在 RAG ETL 类型为 Unstructured 时需要。
    type: boolean
    required: true
    group: "10 功能与可观测性 / Features"
    show_if: "global.rag.etlType=Unstructured"

  - variable: api.openapi.enabled
    label: 启用 OpenAPI
    description: 开放 /openapi/v1/* 端点供 difyctl 或其他程序化客户端使用。
    type: boolean
    required: true
    group: "10 功能与可观测性 / Features"

  - variable: externalPrometheus.enabled
    label: 使用外部 Prometheus
    description: Plugin Manager 从 Prometheus 查询插件资源指标时开启。
    type: boolean
    required: true
    group: "10 功能与可观测性 / Features"

  - variable: externalPrometheus.endpoint
    label: Prometheus Endpoint
    description: 例如 http://prometheus.monitoring.svc:9090。
    type: string
    required: true
    group: "10 功能与可观测性 / Features"
    show_if: "externalPrometheus.enabled=true"

