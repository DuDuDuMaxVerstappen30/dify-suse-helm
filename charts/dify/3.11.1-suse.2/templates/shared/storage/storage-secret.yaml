apiVersion: v1
kind: Secret
metadata:
  name: {{ template "dify.fullname" . }}-shared-storage-secret
data:
  {{- if and (eq .Values.persistence.type "s3") (not .Values.persistence.s3.useAwsManagedIam) }}
  S3_ACCESS_KEY: {{ .Values.persistence.s3.accessKey | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.persistence.s3.secretKey | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.persistence.type "azure-blob" }}
  AZURE_BLOB_ACCOUNT_NAME: {{ .Values.persistence.azureBlob.accountName | b64enc | quote }}
  {{- if .Values.persistence.azureBlob.useManagedIdentity }}
  # constant value: managedidentity
  # see https://github.com/langgenius/dify/commit/fac83e14bc655695e0db58654acbfac5a8fab5b4
  AZURE_BLOB_ACCOUNT_KEY: bWFuYWdlZGlkZW50aXR5
  {{- else }}
  AZURE_BLOB_ACCOUNT_KEY: {{ .Values.persistence.azureBlob.accountKey | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.persistence.type "aliyun-oss" }}
  ALIYUN_OSS_ACCESS_KEY: {{ .Values.persistence.aliyunOss.accessKey | b64enc | quote }}
  ALIYUN_OSS_SECRET_KEY: {{ .Values.persistence.aliyunOss.secretKey | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.persistence.type "google-storage" }}
  GOOGLE_STORAGE_SERVICE_ACCOUNT_JSON_BASE64: {{ .Values.persistence.googleStorage.serviceAccountJson | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.persistence.type "tencent-cos" }}
  TENCENT_COS_SECRET_ID: {{ .Values.persistence.tencentCos.secretId | b64enc | quote }}
  TENCENT_COS_SECRET_KEY: {{ .Values.persistence.tencentCos.secretKey | b64enc | quote }}
  {{- end }}
  {{- if eq .Values.persistence.type "huawei-obs" }}
  HUAWEI_OBS_ACCESS_KEY: {{ .Values.persistence.huaweiObs.accessKey | b64enc | quote }}
  HUAWEI_OBS_SECRET_KEY: {{ .Values.persistence.huaweiObs.secretKey | b64enc | quote }}
  {{- end }}

  {{- if eq .Values.persistence.type "volcengine-tos" }}
  VOLCENGINE_TOS_SECRET_KEY: {{ .Values.persistence.volcengineTos.secretKey | b64enc | quote }}
  VOLCENGINE_TOS_ACCESS_KEY: {{ .Values.persistence.volcengineTos.accessKey | b64enc | quote }}
  {{- end }}
