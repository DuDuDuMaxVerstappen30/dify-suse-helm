{{- range $.Values.additionalWorkers }}
{{- if .enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dify.fullname" $ }}-{{ .name }}-config
data:
  EDITION: {{ $.Values.global.edition | quote }}
  MODE: "worker"
  TZ: "UTC"
  LOG_LEVEL: "INFO"
  LOG_OUTPUT_FORMAT: {{ $.Values.global.log.outputFormat | default "json" | quote }}
  DEPLOY_ENV: {{ $.Values.api.deployEnv | quote }}
  MIGRATION_ENABLED: "false"
  SWAGGER_UI_ENABLED: "false"
  {{- if $.Values.enterprise.enabled }}
  ENTERPRISE_ENABLED: "true"
  ENTERPRISE_API_URL: "http://{{ include "dify.fullname" $ }}-enterprise-svc:8082/inner/api"
  ENTERPRISE_PLUGIN_MANAGER_API_URL: "http://{{ include "dify.fullname" $ }}-plugin-manager-svc:8084/v1/plugin-manager/inner"
  {{- end }}
  {{- if and $.Values.enterprise.enabled $.Values.global.otel.enabled }}
  ENTERPRISE_TELEMETRY_ENABLED: "true"
  ENTERPRISE_OTLP_ENDPOINT: "http://{{ include "dify.fullname" $ }}-enterprise-collector-svc:4317"
  ENTERPRISE_OTLP_PROTOCOL: "grpc"
  {{- if $.Values.global.otel.sender.otlp.headers }}
  ENTERPRISE_OTLP_HEADERS: {{ $.Values.global.otel.sender.otlp.headers | quote }}
  {{- end }}
  ENTERPRISE_INCLUDE_CONTENT: {{ $.Values.global.otel.sender.includeContent | toString | quote }}
  ENTERPRISE_SERVICE_NAME: {{ $.Values.global.otel.sender.serviceName | quote }}
  ENTERPRISE_OTEL_SAMPLING_RATE: {{ $.Values.global.otel.samplingRate | default "1.0" | quote }}
  {{- end }}
  CELERY_QUEUES: {{ .celeryQueues | quote }}
  CELERY_WORKER_QUEUES: {{ .celeryQueues | quote }}
  CELERY_WORKER_AMOUNT: {{ .celeryWorkerAmount | default 1 | quote }}
  CONSOLE_WEB_URL: "{{- if $.Values.global.useTLS -}}https://{{- else -}}http://{{- end -}}{{ $.Values.global.consoleWebDomain }}"
  CONSOLE_API_URL: "{{- if $.Values.global.useTLS -}}https://{{- else -}}http://{{- end -}}{{ $.Values.global.consoleApiDomain }}"
  SERVICE_API_URL: "{{- if $.Values.global.useTLS -}}https://{{- else -}}http://{{- end -}}{{ $.Values.global.serviceApiDomain }}"
  APP_WEB_URL: "{{- if $.Values.global.useTLS -}}https://{{- else -}}http://{{- end -}}{{ $.Values.global.appWebDomain }}"
  FILES_URL: "{{- if $.Values.global.useTLS -}}https://{{- else -}}http://{{- end -}}{{ $.Values.global.filesDomain }}"
  TRIGGER_URL: "{{- if $.Values.global.useTLS -}}https://{{- else -}}http://{{- end -}}{{ $.Values.global.triggerDomain }}"
  SQLALCHEMY_POOL_SIZE: {{ (.db).poolSize | default 250 | quote }}
  SQLALCHEMY_POOL_RECYCLE: {{ (.db).poolRecycle | default 3600 | quote }}
  KEYWORD_DATA_SOURCE_TYPE: {{ $.Values.global.rag.keywordDataSourceType | quote }}
  {{- if $.Values.ssrfProxy.enabled }}
  SSRF_PROXY_HTTP_URL: "http://{{ include "dify.fullname" $ }}-ssrf-proxy-svc:3128"
  SSRF_PROXY_HTTPS_URL: "http://{{ include "dify.fullname" $ }}-ssrf-proxy-svc:3128"
  {{- end }}
  {{- if eq $.Values.global.rag.etlType "Unstructured" }}
  ETL_TYPE: "Unstructured"
  UNSTRUCTURED_API_URL: "http://{{ include "dify.fullname" $ }}-unstructured-svc:8000/general/v0/general"
  {{- else }}
  ETL_TYPE: "dify"
  {{- end }}
  MODEL_LB_ENABLED: "true"
  {{- if (.sentry).enabled }}
  SENTRY_DSN: {{ .sentry.dsn | quote }}
  SENTRY_TRACES_SAMPLE_RATE: {{ .sentry.tracesSampleRate | default "1.0" | quote }}
  SENTRY_PROFILES_SAMPLE_RATE: {{ .sentry.profilesSampleRate | default "1.0" | quote }}
  {{- end }}

  CODE_EXECUTION_ENDPOINT: "http://{{ include "dify.fullname" $ }}-sandbox-svc:8194"

  {{- if $.Values.plugin_daemon.enabled }}
  PLUGIN_REMOTE_INSTALL_HOST: {{ $.Values.plugin_daemon.remoteInstallHost | quote }}
  PLUGIN_REMOTE_INSTALL_PORT: {{ $.Values.plugin_daemon.remoteInstallPort | quote }}
  PLUGIN_MAX_PACKAGE_SIZE: "52428800"
  INNER_API_KEY_FOR_PLUGIN: {{ $.Values.global.innerApiKey | quote }}
  PLUGIN_DAEMON_PORT: "5002"
  PLUGIN_DAEMON_KEY: {{ $.Values.global.innerApiKey }}
  PLUGIN_DAEMON_URL: "http://{{ include "dify.fullname" $ }}-plugin-daemon-svc:5002"
  MARKETPLACE_ENABLED: {{ $.Values.global.marketplace.enabled | toString | quote }}
  MARKETPLACE_API_URL: {{ $.Values.global.marketplace.apiUrl | quote }}
  {{- end }}

  {{- include "dify.otel.config" $ | nindent 2 }}

{{- end }}
{{- end }}
