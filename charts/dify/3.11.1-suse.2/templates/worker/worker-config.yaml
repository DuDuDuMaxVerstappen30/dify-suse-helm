{{- if .Values.worker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "dify.fullname" . }}-worker-config
data:
  EDITION: {{ .Values.global.edition | quote }}
  MODE: "worker"
  TZ: "UTC"
  LOG_LEVEL: "INFO"
  LOG_OUTPUT_FORMAT: {{ .Values.global.log.outputFormat | default "json" | quote }}
  DEPLOY_ENV: {{ .Values.api.deployEnv | quote }}
  MIGRATION_ENABLED: "false"
  SWAGGER_UI_ENABLED: "false"
  {{- if .Values.enterprise.enabled }}
  ENTERPRISE_ENABLED: "true"
  ENTERPRISE_API_URL: "http://{{ template "dify.fullname" . }}-enterprise-svc:8082/inner/api"
  ENTERPRISE_PLUGIN_MANAGER_API_URL: "http://{{ template "dify.fullname" . }}-plugin-manager-svc:8084/v1/plugin-manager/inner"
  {{- end }}
  {{- if and .Values.enterprise.enabled .Values.global.otel.enabled }}
  ENTERPRISE_TELEMETRY_ENABLED: "true"
  ENTERPRISE_OTLP_ENDPOINT: "http://{{ template "dify.fullname" . }}-enterprise-collector-svc:4317"
  ENTERPRISE_OTLP_PROTOCOL: "grpc"
  {{- if .Values.global.otel.sender.otlp.headers }}
  ENTERPRISE_OTLP_HEADERS: {{ .Values.global.otel.sender.otlp.headers | quote }}
  {{- end }}
  ENTERPRISE_INCLUDE_CONTENT: {{ .Values.global.otel.sender.includeContent | toString | quote }}
  ENTERPRISE_SERVICE_NAME: {{ .Values.global.otel.sender.serviceName | quote }}
  ENTERPRISE_OTEL_SAMPLING_RATE: {{ .Values.global.otel.samplingRate | default "1.0" | quote }}
  {{- end }}
  CELERY_QUEUES: {{ .Values.worker.celeryQueues | quote }}
  CELERY_WORKER_AMOUNT: {{ .Values.worker.celeryWorkerAmount | quote }}
  CONSOLE_WEB_URL: {{ include "dify.externalUrl" (dict "domain" .Values.global.consoleWebDomain "useTLS" .Values.global.useTLS "port" .Values.global.externalPort) | quote }}
  CONSOLE_API_URL: {{ include "dify.externalUrl" (dict "domain" .Values.global.consoleApiDomain "useTLS" .Values.global.useTLS "port" .Values.global.externalPort) | quote }}
  SERVICE_API_URL: {{ include "dify.externalUrl" (dict "domain" .Values.global.serviceApiDomain "useTLS" .Values.global.useTLS "port" .Values.global.externalPort) | quote }}
  APP_WEB_URL: {{ include "dify.externalUrl" (dict "domain" .Values.global.appWebDomain "useTLS" .Values.global.useTLS "port" .Values.global.externalPort) | quote }}
  FILES_URL: {{ include "dify.externalUrl" (dict "domain" .Values.global.filesDomain "useTLS" .Values.global.useTLS "port" .Values.global.externalPort) | quote }}
  TRIGGER_URL: {{ include "dify.externalUrl" (dict "domain" .Values.global.triggerDomain "useTLS" .Values.global.useTLS "port" .Values.global.externalPort) | quote }}
  SQLALCHEMY_POOL_SIZE: {{ .Values.worker.db.poolSize | quote }}
  SQLALCHEMY_POOL_RECYCLE: {{ .Values.worker.db.poolRecycle | quote }}
  KEYWORD_DATA_SOURCE_TYPE: {{ .Values.global.rag.keywordDataSourceType | quote }}
  {{- if .Values.ssrfProxy.enabled }}
  SSRF_PROXY_HTTP_URL: "http://{{ template "dify.fullname" . }}-ssrf-proxy-svc:3128"
  SSRF_PROXY_HTTPS_URL: "http://{{ template "dify.fullname" . }}-ssrf-proxy-svc:3128"
  {{- end }}
  {{- if eq .Values.global.rag.etlType "Unstructured" }}
  ETL_TYPE: "Unstructured"
  UNSTRUCTURED_API_URL: "http://{{ template "dify.fullname" . }}-unstructured-svc:8000/general/v0/general"
  {{- else }}
  ETL_TYPE: "dify"
  {{- end }}
  MODEL_LB_ENABLED: "true"
  {{- if .Values.worker.sentry.enabled }}
  SENTRY_DSN: {{ .Values.worker.sentry.dsn | quote }}
  SENTRY_TRACES_SAMPLE_RATE: {{ .Values.worker.sentry.tracesSampleRate | quote }}
  SENTRY_PROFILES_SAMPLE_RATE: {{ .Values.worker.sentry.profilesSampleRate | quote }}
  {{- end }}

  CODE_EXECUTION_ENDPOINT: "http://{{ template "dify.fullname" . }}-sandbox-svc:8194"

  {{- if .Values.plugin_daemon.enabled }}
  PLUGIN_REMOTE_INSTALL_HOST: {{ .Values.plugin_daemon.remoteInstallHost | quote }}
  PLUGIN_REMOTE_INSTALL_PORT: {{ .Values.plugin_daemon.remoteInstallPort | quote }}
  PLUGIN_MAX_PACKAGE_SIZE: "52428800"
  INNER_API_KEY_FOR_PLUGIN: {{ .Values.global.innerApiKey | quote }}
  PLUGIN_DAEMON_PORT: "5002"
  PLUGIN_DAEMON_KEY: {{ .Values.global.innerApiKey }}
  PLUGIN_DAEMON_URL: "http://{{ template "dify.fullname" . }}-plugin-daemon-svc:5002"
  MARKETPLACE_ENABLED: {{ .Values.global.marketplace.enabled | toString | quote }}
  MARKETPLACE_API_URL: {{ .Values.global.marketplace.apiUrl | quote }}
  {{- end }}

  {{- include "dify.otel.config" . | nindent 2 }}

{{- end }}
