{{- if .Values.enterpriseFrontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "dify.fullname" . }}-enterprise-frontend-svc
  labels:
{{ include "dify.labels" . | indent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: enterprise-frontend
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
{{ include "dify.selectorLabels" . | indent 4 }}
    app: {{ template "dify.fullname" . }}-enterprise-frontend
{{- end }}