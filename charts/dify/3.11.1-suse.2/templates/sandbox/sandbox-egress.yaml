{{- if .Values.ssrfProxy.enabled }}
{{- if .Values.sandbox.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
{{- include "dify.labels" . | nindent 4 }}
  name: {{ template "dify.fullname" . }}-sandbox-egress
spec:
  egress:
  - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
  - ports:
      - port: 3128
        protocol: TCP
    to:
      - podSelector:
          matchLabels:
            app: {{ template "dify.fullname" . }}-ssrf-proxy
  podSelector:
    matchLabels:
      app: {{ template "dify.fullname" . }}-sandbox
  policyTypes:
    - Egress
{{- end }}
{{- end }}