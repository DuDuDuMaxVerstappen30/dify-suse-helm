{{- if .Values.enterprise.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dify-enterprise
  namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dify-enterprise-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dify-enterprise-rolebinding
subjects:
- kind: ServiceAccount
  name: dify-enterprise
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: dify-enterprise-role
  apiGroup: rbac.authorization.k8s.io
