{{- $runtimeNamespace := include "dify.pluginRuntimeNamespace" . }}
{{- $serviceAccountName := include "dify.pluginControllerServiceAccountName" . }}
{{- $roleName := printf "%s-plugin-controller-role" (include "dify.fullname" .) }}
{{- $roleBindingName := printf "%s-plugin-controller-rolebinding" (include "dify.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  namespace: {{ $runtimeNamespace }}
  labels:
    app.kubernetes.io/name: dify-plugin-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $runtimeNamespace }}
  labels:
    app.kubernetes.io/name: dify-plugin-controller
rules:
- apiGroups:
  - enterprise.dify.ai
  resources:
  - difyplugins
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - enterprise.dify.ai
  resources:
  - difyplugins/finalizers
  verbs:
  - update
- apiGroups:
  - enterprise.dify.ai
  resources:
  - difyplugins/scale
  - difyplugins/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - events
  - services
  - configmaps
  - pods
  - pods/log
  verbs:
  - "*"
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - "*"
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - "*"
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: dify-plugin-controller
  name: {{ $roleBindingName }}
  namespace: {{ $runtimeNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
- kind: ServiceAccount
  name: {{ $serviceAccountName }}
  namespace: {{ $runtimeNamespace }}
